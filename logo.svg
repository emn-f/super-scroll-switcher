<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Super Scroll Switcher Logo">
  <defs>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.2" fill="#f1f1f6" fill-opacity="0.13" />
    </pattern>

    <!-- Reusable Overview windows + scroll glyph -->
    <g id="switcher-glyph">
      <!-- Back-left window -->
      <rect x="76" y="138" width="150" height="186" fill="none" stroke="currentColor" stroke-width="18" />
      <rect x="76" y="138" width="150" height="32" fill="currentColor" />

      <!-- Back-right window -->
      <rect x="246" y="138" width="150" height="186" fill="none" stroke="currentColor" stroke-width="18" />
      <rect x="246" y="138" width="150" height="32" fill="currentColor" />

      <!-- Center active window (solid cutout + bold frame) -->
      <rect x="136" y="106" width="200" height="250" fill="currentColor" />
    </g>
  </defs>

  <!-- Spider-Verse Chromatic Hard Shadows -->
  <rect x="48" y="48" width="432" height="432" fill="#00e5ff" />
  <rect x="34" y="34" width="432" height="432" fill="#ff0033" />

  <!-- Main Dark Square + Halftone -->
  <rect x="20" y="20" width="432" height="432" fill="#090d16" stroke="#4a4a60" stroke-width="14" />
  <rect x="27" y="27" width="418" height="418" fill="url(#halftone)" />

  <!-- Glitch Layer: Red (-10, +7) -->
  <g color="#ff0033" transform="translate(-10, 7)">
    <use href="#switcher-glyph" />
  </g>

  <!-- Glitch Layer: Cyan (+10, -7) -->
  <g color="#00e5ff" transform="translate(10, -7)">
    <use href="#switcher-glyph" />
  </g>

  <!-- Crisp White Foreground Windows -->
  <g color="#f1f1f6">
    <!-- Back-left window -->
    <rect x="76" y="138" width="150" height="186" fill="#090d16" stroke="#f1f1f6" stroke-width="18" />
    <rect x="76" y="138" width="150" height="32" fill="#f1f1f6" />

    <!-- Back-right window -->
    <rect x="246" y="138" width="150" height="186" fill="#090d16" stroke="#f1f1f6" stroke-width="18" />
    <rect x="246" y="138" width="150" height="32" fill="#f1f1f6" />

    <!-- Center Active Window -->
    <rect x="136" y="106" width="200" height="250" fill="#090d16" stroke="#f1f1f6" stroke-width="20" />
    <rect x="136" y="106" width="200" height="38" fill="#f1f1f6" />
  </g>

  <!-- Emerald Scroll Wheel + Up/Down Arrows inside active window -->
  <g transform="translate(236, 248)">
    <!-- Cyan shadow on emerald accent -->
    <g fill="#00e5ff" transform="translate(4, -4)" opacity="0.75">
      <!-- Up chevron -->
      <polygon points="0,-64 -26,-36 26,-36" />
      <!-- Scroll pill -->
      <rect x="-18" y="-22" width="36" height="52" rx="18" />
      <!-- Down chevron -->
      <polygon points="0,72 -26,44 26,44" />
    </g>

    <!-- Emerald #6ee7b7 -->
    <g fill="#6ee7b7">
      <!-- Up chevron -->
      <polygon points="0,-64 -26,-36 26,-36" />
      <!-- Scroll pill -->
      <rect x="-18" y="-22" width="36" height="52" rx="18" />
      <!-- Down chevron -->
      <polygon points="0,72 -26,44 26,44" />
    </g>

    <!-- Inner wheel notch -->
    <rect x="-5" y="-8" width="10" height="24" rx="5" fill="#090d16" />
  </g>
</svg>
